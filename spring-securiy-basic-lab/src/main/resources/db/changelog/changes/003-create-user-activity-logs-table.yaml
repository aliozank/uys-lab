databaseChangeLog:
  - changeSet:
      id: 003-create-user-activity-logs-table
      author: alikaracor
      changes:
        - createTable:
            tableName: user_activity_logs
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: username
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: activity_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false