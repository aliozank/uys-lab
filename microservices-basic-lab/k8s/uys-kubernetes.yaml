apiVersion: v1
kind: ConfigMap
metadata:
  name: flight-service-config
data:
  REFERENCE_SERVICE_BASE_URL: http://reference-service:8081

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: reference-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reference-service
  template:
    metadata:
      labels:
        app: reference-service
    spec:
      containers:
        - name: reference-service
          image: reference-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081

---

apiVersion: v1
kind: Service
metadata:
  name: reference-service
spec:
  type: ClusterIP
  selector:
    app: reference-service
  ports:
    - port: 8081
      targetPort: 8081

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: flight-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flight-service
  template:
    metadata:
      labels:
        app: flight-service
    spec:
      containers:
        - name: flight-service
          image: flight-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: flight-service-config

---

apiVersion: v1
kind: Service
metadata:
  name: flight-service
spec:
  type: LoadBalancer
  selector:
    app: flight-service
  ports:
    - port: 8082
      targetPort: 8082