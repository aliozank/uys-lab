name: Reference Service CI

on:
  push:
    branches:
      - main
    paths:
      - "microservices-basic-lab/reference-service/**"
      - ".github/workflows/reference-service-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "microservices-basic-lab/reference-service/**"
      - ".github/workflows/reference-service-ci.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: microservices-basic-lab/reference-service

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: microservices-basic-lab/reference-service/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests and build application
        run: ./mvnw --batch-mode clean verify

      - name: Upload application jar
        uses: actions/upload-artifact@v7
        with:
          name: reference-service-jar
          path: microservices-basic-lab/reference-service/target/*.jar
          if-no-files-found: error
          retention-days: 7